apiVersion: 1

providers:
  - name: grpc-lb
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # Mounted read-only from monitoring/grafana/dashboards by docker-compose.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
