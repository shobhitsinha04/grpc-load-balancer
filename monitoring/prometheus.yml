# Prometheus scrape configuration.
#
# The static_configs job targets the docker-compose stack. The commented
# kubernetes_sd_configs job is the equivalent for the k8s manifests, matching
# the prometheus.io/* annotations set in k8s/20-lb.yaml.

global:
  # The LB evicts a backend within ~500ms. A 15s default scrape interval would
  # sample an eviction and its recovery into the same gap and show nothing, so
  # the interval is tightened to keep failover visible on a dashboard.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # --- docker-compose ---
  - job_name: grpc-lb
    metrics_path: /metrics
    static_configs:
      - targets: ["lb:9100"]
        labels:
          env: local

